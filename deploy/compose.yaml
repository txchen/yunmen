# Personal deployment: Yunmen behind Cloudflare Tunnel and Access.
# Yunmen publishes no host port; only cloudflared reaches it on the private
# network. Read docs/deployment.md before starting.
services:
  yunmen:
    image: ghcr.io/txchen/yunmen:latest
    restart: unless-stopped
    env_file: yunmen.env
    environment:
      YUNMEN_MODE: access
      YUNMEN_MASTER_KEY_FILE: /run/secrets/yunmen_master_key
    secrets:
      - yunmen_master_key
    volumes:
      - yunmen-data:/data
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    networks: [internal]

secrets:
  yunmen_master_key:
    file: ./secrets/master.key
  tunnel_token:
    file: ./secrets/tunnel.token

volumes:
  yunmen-data:

networks:
  internal:
