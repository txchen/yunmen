# Yunmen for a Cloudflare Tunnel (or HTTPS reverse proxy) running on this host.
# Sign-in is Yunmen's own password and TOTP. Read docs/deployment.md first.
services:
  yunmen:
    image: ghcr.io/txchen/yunmen:latest
    restart: unless-stopped
    # Your own user (`id -u`:`id -g`), so the container can read the
    # owner-only key file and write ./data.
    user: "1000:1000"
    environment:
      YUNMEN_MODE: standalone
      # The exact https:// address you open in the browser.
      YUNMEN_PUBLIC_ORIGIN: https://yunmen.example.com
      YUNMEN_MASTER_KEY_FILE: /run/secrets/yunmen_master_key
      # Rate limit sign-in per visitor, using the address Cloudflare reports.
      # Safe only because the port below is reachable from this host alone.
      YUNMEN_CLIENT_IP_HEADER: Cf-Connecting-IP
    secrets:
      - yunmen_master_key
    volumes:
      - ./data:/data
    # Loopback only: cloudflared on this host reaches it at
    # http://localhost:8080 and provides HTTPS. Nothing else can connect.
    ports:
      - "127.0.0.1:8080:8080"

secrets:
  yunmen_master_key:
    file: ./secrets/master.key
